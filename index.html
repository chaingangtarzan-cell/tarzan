<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: black;
  color: #00ff00;
  font-family: monospace;
  overflow: hidden;
}

#screen {
  width: 100%;
  height: 100%;
  padding: 20px;
  box-sizing: border-box;
  font-size: 18px;
}

.title {
  color: red;
  text-align: center;
  font-size: 32px;
  margin-top: 20px;
}

#bar {
  width: 90%;
  height: 25px;
  border: 2px solid #00ff00;
  margin: 30px auto;
}

#fill {
  height: 100%;
  width: 0%;
  background: #00ff00;
}

#final {
  text-align: center;
  font-size: 30px;
  color: yellow;
  margin-top: 50px;
}
</style>

</head>

<body>

<div id="screen">

<div class="title">⚠ SYSTEM ALERT ⚠</div>

<div id="text"></div>

<div id="bar">
<div id="fill"></div>
</div>

<div id="final"></div>

</div>

<script>

let lines = [
"BOOTING SECURITY SYSTEM...",
"CONNECTING TO SERVER...",
"ENCRYPTED CONNECTION ESTABLISHED...",
"ANALYZING DEVICE...",
"RUNNING SECURITY CHECK...",
"ACCESSING SIMULATION MODE...",
"LOADING TARZAN.EXE...",
"FINALIZING PRANK..."
];

let i = 0;
let text = document.getElementById("text");
let fill = document.getElementById("fill");

function run(){

if(i < lines.length){

text.innerHTML += "> " + lines[i] + "<br>";
fill.style.width = ((i+1) * 12.5) + "%";
i++;

setTimeout(run,1000);

}

else {

document.getElementById("final").innerHTML =
"😂 YOU GOT PRANKED<br><br>🐒 HACKED BY TARZAN 🐒<br><br>Your phone is fine.";

}

}

run();

</script>

</body>
</html>
