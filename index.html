<!DOCTYPE html>
<html>
<head>
<title>System Console</title>

<style>
body {
  background: black;
  color: #00ff00;
  font-family: monospace;
  padding: 20px;
  overflow: hidden;
}

#terminal {
  font-size: 16px;
  line-height: 1.5;
}

.warning {
  color: red;
  font-size: 28px;
  text-align: center;
}

.bar {
  border: 1px solid #00ff00;
  width: 100%;
  height: 20px;
  margin-top: 20px;
}

.progress {
  background: #00ff00;
  height: 100%;
  width: 0%;
}

.final {
  color: yellow;
  font-size: 25px;
  text-align: center;
}
</style>

</head>

<body>

<div id="terminal">
<div class="warning">⚠ SYSTEM BREACH ⚠</div>
<br>
</div>

<div class="bar">
<div class="progress" id="progress"></div>
</div>

<script>

let terminal = document.getElementById("terminal");
let progress = document.getElementById("progress");

let messages = [
"Connecting to secure server...",
"Initializing encrypted tunnel...",
"Loading security protocols...",
"Analyzing device status...",
"Checking system permissions...",
"Bypassing firewall simulation...",
"Decrypting fake access keys...",
"Running Tarzan.exe...",
"Uploading banana protocol...",
"Almost complete..."
];

let count = 0;

function addLine(){
 if(count < messages.length){

  let line = document.createElement("div");
  line.innerHTML = "> " + messages[count];
  terminal.appendChild(line);

  progress.style.width = ((count+1) * 10) + "%";

  count++;

  setTimeout(addLine, 1200);

 } else {

  setTimeout(function(){

   terminal.innerHTML =
   "<div class='final'>😂 YOU GOT PRANKED<br><br>🐒 HACKED BY TARZAN 🐒<br><br>Relax, your phone is fine.</div>";

   progress.style.width="100%";

  },1500);

 }

}

addLine();

</script>

</body>
</html>
